<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Calcula — Free Online Scientific Calculator</title>
  <meta name="description" content="A free online scientific calculator for arithmetic, trigonometry, logarithms, and complex equations. No downloads, works instantly in your browser.">
  <meta name="keywords" content="scientific calculator, online calculator, trig calculator, log calculator, free calculator">
  <link rel="canonical" href="https://calcula-rouge.vercel.app/">

  <!-- Robots -->
  <meta name="robots" content="index, follow">

  <!-- Open Graph (social sharing / link previews) -->
<meta property="og:title" content="Calcula – Free Online Scientific Calculator">
<meta property="og:description" content="Solve arithmetic, trigonometry, logarithms, and more — right in your browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://calcula-rouge.vercel.app/">
<meta property="og:image" content="https://github.com/valleadincome/calcula/blob/35438b7ef38a3588e5bb6b447368f78aa08a9850/IMG_20260727_090704.jpg">
  

  <!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Calcula – Free Online Scientific Calculator">
<meta name="twitter:description" content="Solve arithmetic, trigonometry, logarithms, and more — right in your browser.">
<meta name="twitter:image" content="https://github.com/valleadincome/calcula/blob/35438b7ef38a3588e5bb6b447368f78aa08a9850/IMG_20260727_090704.jpg">

  

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  
  <!-- Structured Data (helps Google understand it's a tool) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Calcula",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Web",
  "description": "A free online scientific calculator for arithmetic, trigonometry, logarithms, and complex equations.",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <span class="app-logo">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="9" stroke="#2DD4BF" stroke-width="1.5"/>
          <path d="M6 10h8M10 6v8" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Calcula
      </span>
      <div class="mode-toggle" role="group" aria-label="Angle mode">
        <button class="mode-btn active" id="btn-deg" data-mode="deg" aria-pressed="true">DEG</button>
        <button class="mode-btn" id="btn-rad" data-mode="rad" aria-pressed="false">RAD</button>
      </div>
    </header>

    <main class="calculator" role="main">
      <!-- Display -->
      <section class="display" aria-label="Calculator display">
        <div class="history-scroll" id="history-scroll" aria-live="polite" aria-label="Calculation history">
          <!-- History lines injected by JS -->
        </div>
        <div class="display-expression" id="display-expression" aria-label="Current expression" aria-live="polite"></div>
        <div class="display-result" id="display-result" aria-label="Result"></div>
        <div class="display-cursor" aria-hidden="true"></div>
      </section>

      <!-- Keypad -->
      <div class="keypad" role="group" aria-label="Calculator keys">

        <!-- Row 1: Memory + utility -->
        <div class="key-row">
          <button class="key key--mem" data-action="mem-store"   aria-label="Memory store">MS</button>
          <button class="key key--mem" data-action="mem-recall"  aria-label="Memory recall">MR</button>
          <button class="key key--mem" data-action="mem-add"     aria-label="Memory add">M+</button>
          <button class="key key--mem" data-action="mem-clear"   aria-label="Memory clear">MC</button>
          <button class="key key--util" data-action="clear-all"  aria-label="Clear all">AC</button>
          <button class="key key--util" data-action="backspace"  aria-label="Backspace">⌫</button>
        </div>

        <!-- Row 2: Trig -->
        <div class="key-row">
          <button class="key key--fn" data-action="fn" data-fn="sin"   aria-label="Sine">sin</button>
          <button class="key key--fn" data-action="fn" data-fn="cos"   aria-label="Cosine">cos</button>
          <button class="key key--fn" data-action="fn" data-fn="tan"   aria-label="Tangent">tan</button>
          <button class="key key--fn" data-action="fn" data-fn="asin"  aria-label="Arc sine">sin⁻¹</button>
          <button class="key key--fn" data-action="fn" data-fn="acos"  aria-label="Arc cosine">cos⁻¹</button>
          <button class="key key--fn" data-action="fn" data-fn="atan"  aria-label="Arc tangent">tan⁻¹</button>
        </div>

        <!-- Row 3: Powers & roots -->
        <div class="key-row">
          <button class="key key--fn" data-action="fn" data-fn="sqrt"  aria-label="Square root">√x</button>
          <button class="key key--fn" data-action="fn" data-fn="cbrt"  aria-label="Cube root">∛x</button>
          <button class="key key--fn" data-action="fn" data-fn="sq"    aria-label="Square">x²</button>
          <button class="key key--fn" data-action="fn" data-fn="cube"  aria-label="Cube">x³</button>
          <button class="key key--fn" data-action="operator" data-val="^" aria-label="Power">xʸ</button>
          <button class="key key--fn" data-action="fn" data-fn="recip" aria-label="Reciprocal">1/x</button>
        </div>

        <!-- Row 4: Log / exp / const -->
        <div class="key-row">
          <button class="key key--fn" data-action="fn" data-fn="log"   aria-label="Logarithm base 10">log</button>
          <button class="key key--fn" data-action="fn" data-fn="ln"    aria-label="Natural logarithm">ln</button>
          <button class="key key--fn" data-action="fn" data-fn="exp"   aria-label="e to the power x">eˣ</button>
          <button class="key key--fn" data-action="fn" data-fn="10x"   aria-label="10 to the power x">10ˣ</button>
          <button class="key key--const" data-action="constant" data-val="Math.PI" aria-label="Pi">π</button>
          <button class="key key--const" data-action="constant" data-val="Math.E"  aria-label="Euler's number">e</button>
        </div>

        <!-- Row 5: Parens + percent + digits top -->
        <div class="key-row">
          <button class="key key--paren" data-action="paren" data-val="(" aria-label="Open parenthesis">(</button>
          <button class="key key--paren" data-action="paren" data-val=")" aria-label="Close parenthesis">)</button>
          <button class="key key--fn"   data-action="fn" data-fn="abs"  aria-label="Absolute value">|x|</button>
          <button class="key key--fn"   data-action="fn" data-fn="fact" aria-label="Factorial">n!</button>
          <button class="key key--op"   data-action="operator" data-val="%" aria-label="Modulo">mod</button>
          <button class="key key--op"   data-action="sign-toggle" aria-label="Toggle sign">±</button>
        </div>

        <!-- Row 6–8: Numeric + operators -->
        <div class="key-row">
          <button class="key key--digit" data-action="digit" data-val="7" aria-label="7">7</button>
          <button class="key key--digit" data-action="digit" data-val="8" aria-label="8">8</button>
          <button class="key key--digit" data-action="digit" data-val="9" aria-label="9">9</button>
          <button class="key key--op"    data-action="operator" data-val="/" aria-label="Divide">÷</button>
          <button class="key key--fn"    data-action="fn" data-fn="floor" aria-label="Floor">⌊x⌋</button>
          <button class="key key--fn"    data-action="fn" data-fn="ceil"  aria-label="Ceiling">⌈x⌉</button>
        </div>

        <div class="key-row">
          <button class="key key--digit" data-action="digit" data-val="4" aria-label="4">4</button>
          <button class="key key--digit" data-action="digit" data-val="5" aria-label="5">5</button>
          <button class="key key--digit" data-action="digit" data-val="6" aria-label="6">6</button>
          <button class="key key--op"    data-action="operator" data-val="*" aria-label="Multiply">×</button>
          <button class="key key--fn"    data-action="fn" data-fn="log2"  aria-label="Logarithm base 2">log₂</button>
          <button class="key key--fn"    data-action="fn" data-fn="sinh"  aria-label="Hyperbolic sine">sinh</button>
        </div>

        <div class="key-row">
          <button class="key key--digit" data-action="digit" data-val="1" aria-label="1">1</button>
          <button class="key key--digit" data-action="digit" data-val="2" aria-label="2">2</button>
          <button class="key key--digit" data-action="digit" data-val="3" aria-label="3">3</button>
          <button class="key key--op"    data-action="operator" data-val="-" aria-label="Subtract">−</button>
          <button class="key key--fn"    data-action="fn" data-fn="cosh"  aria-label="Hyperbolic cosine">cosh</button>
          <button class="key key--fn"    data-action="fn" data-fn="tanh"  aria-label="Hyperbolic tangent">tanh</button>
        </div>

        <!-- Row 9: Zero / decimal / equals -->
        <div class="key-row key-row--bottom">
          <button class="key key--digit key--zero" data-action="digit" data-val="0" aria-label="0">0</button>
          <button class="key key--digit" data-action="decimal" aria-label="Decimal point">.</button>
          <button class="key key--op"    data-action="operator" data-val="+" aria-label="Add">+</button>
          <button class="key key--equals" data-action="evaluate" aria-label="Equals">=</button>
        </div>

      </div>
    </main>

    <footer class="app-footer" aria-label="Keyboard shortcuts">
      <span>Keyboard supported</span>
      <span class="footer-sep">·</span>
      <span>Type expressions directly</span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="calculator.js"></script>
</body>
</html>
